<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Bangumi Anison Helper Fixture</title>
  <style>
    body {
      margin: 40px auto;
      max-width: 980px;
      color: #333;
      background: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { padding: 16px 20px; background: #fff; border: 1px solid #ddd; }
    .subject { padding: 20px; background: #fff; border: 1px solid #ddd; }
  </style>
  <script>
    localStorage.setItem('anison_auto_mora_inline', '0');

    const mainTable = `
      <table class="sorted">
        <thead><tr><th id="program">番組名</th></tr></thead>
        <tbody>
          <tr>
            <td headers="program">
              <a href="javascript:link('program','bocchi')">ぼっち・ざ・ろっく！</a>
            </td>
          </tr>
        </tbody>
      </table>`;

    const detailTable = `
      <table class="sorted">
        <thead>
          <tr>
            <th id="oped">種別</th>
            <th id="song">曲名</th>
            <th id="vocal">歌手</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td headers="oped">OP</td>
            <td headers="song">青春コンプレックス</td>
            <td headers="vocal">結束バンド</td>
          </tr>
          <tr>
            <td headers="oped">ED</td>
            <td headers="song">Distortion!!</td>
            <td headers="vocal">結束バンド</td>
          </tr>
        </tbody>
      </table>`;

    window.GM_xmlhttpRequest = function (options) {
      const responseText = options.url.includes('/data/program/')
        ? detailTable
        : mainTable;
      setTimeout(function () {
        options.onload({ status: 200, responseText });
      }, 10);
    };
  </script>
</head>
<body>
  <div class="subject">
    <h1 class="nameSingle">
      <a property="v:itemreviewed" href="/subject/fixture">ぼっち・ざ・ろっく！</a>
    </h1>
    <p>公開版ユーザースクリプトのページ統合テスト用フィクスチャです。</p>
  </div>
  <script src="../../bangumi-anison-helper.user.js"></script>
</body>
</html>
